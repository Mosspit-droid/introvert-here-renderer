name: Diagnose Fetch (CLAUDE TEST - delete after use)

# One-off diagnostic workflow: fetches a single URL the exact same way
# render-once.js does for background/product images, and reports back
# what actually happened (status, headers, byte length, whether it
# looks like a valid image) instead of trying to render a video with
# it. Exists only to isolate why the Y003 background image fetch is
# failing while product image fetches succeed - delete this workflow
# file once that's understood.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to fetch and report diagnostics for'
        required: true
      callback_url:
        description: 'URL to POST the diagnostic JSON to'
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # Same container as render.yml, so this reproduces the exact same
    # network/runtime environment the real background-image fetch runs in.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fetch URL and report diagnostics
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: node diagnose-fetch.js
