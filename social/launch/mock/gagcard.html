<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Montserrat,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 42%,#23221f,#121211 70%,#0b0b0a)}
.logo{position:absolute;left:110px;width:860px;top:600px}
.box{position:absolute;left:110px;width:860px;top:820px;text-align:right;font-weight:400;line-height:1.2;letter-spacing:-.04em;color:#fff}
.lab{position:absolute;left:0;right:0;top:500px;text-align:center;font-size:30px;letter-spacing:.22em;color:#a9a59b;font-weight:600}
.m{position:absolute;visibility:hidden;font-weight:400;letter-spacing:-.04em;white-space:nowrap}
</style></head><body><div class="bg"></div><div class="lab" id="lab"></div><img class="logo" src="logo-wide.png"><div class="box" id="box"></div><span class="m" id="m">WWWWWWWWWWWW</span>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('lab').textContent=q.get('label')||'';
const lines=(q.get('text')||'').split('\n');
document.getElementById('box').innerHTML=lines.map(l=>l?'<div>'+l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>':'<div style="height:1.2em">&nbsp;</div>').join('');
document.fonts.ready.then(()=>{const m=document.getElementById('m');m.style.fontSize='100px';const w=m.getBoundingClientRect().width;document.getElementById('box').style.fontSize=(860/w*100)+'px';document.title='ready'});
</script></body></html>
