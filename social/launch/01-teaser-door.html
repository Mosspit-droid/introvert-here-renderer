<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#121211;--text:#f2f0ea;--muted:#a9a59b;--post:#bea292}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);overflow:hidden}
  #stage{position:relative;width:var(--W);height:var(--H);background:
    radial-gradient(ellipse 70% 55% at 50% 42%, #23221f 0%, #121211 70%, #0b0b0a 100%);font-family:Montserrat,sans-serif;color:var(--text)}
  
  /* a doorway: warm room light beyond, painted frame, Hoodini leaning in from behind the left jamb */
  #frame{position:absolute;left:var(--dX);top:var(--dY);width:var(--dW);height:var(--dH);
    border:var(--j) solid #d8cfbf;border-bottom:0;box-shadow:0 0 0 3px #0a0a09, 0 30px 80px rgba(0,0,0,.6);
    background:radial-gradient(ellipse 90% 70% at 60% 35%, #8a6a44 0%, #4a3826 45%, #241b13 100%)}
  #floor{position:absolute;left:calc(var(--dX) - 60px);width:calc(var(--dW) + 120px);top:calc(var(--dY) + var(--dH));height:3px;background:#2c2a26}
  #spill{position:absolute;left:var(--dX);width:var(--dW);top:calc(var(--dY) + var(--dH));height:180px;
    background:linear-gradient(#5a442c33,transparent);clip-path:polygon(0 0,100% 0,120% 100%,-20% 100%)}
  #door{position:absolute;top:var(--hY);left:calc(var(--dX) + var(--j));
    width:calc(127px*var(--s));height:calc(var(--dY) + var(--dH) - var(--hY));overflow:hidden}
  #hood{height:calc(289px*var(--s)) !important;bottom:auto !important}
  #hood{position:absolute;inset:0;background:url(assets/hoodini-peek-only.png) left top/100% 100% no-repeat;
    image-rendering:auto;transform:translateX(-101%)}
  #copy{position:absolute;left:0;right:0;top:var(--tY);text-align:center;padding:0 80px}
  #l1{font-weight:800;font-size:var(--f1);letter-spacing:-.02em;line-height:1.05;opacity:0}
  #l2{font-weight:400;font-size:var(--f2);color:var(--muted);margin-top:.9em;opacity:0}
  #logo{position:absolute;left:50%;bottom:var(--lB);width:var(--lW);transform:translateX(-50%);opacity:0}
  #grain{position:absolute;inset:0;opacity:.07;pointer-events:none;mix-blend-mode:overlay}
</style></head>
<body>
<div id="stage">
  <div id="frame"></div><div id="floor"></div><div id="spill"></div>
  <div id="door"><div id="hood"></div></div>
  <div id="copy"><div id="l1">Something's coming.</div><div id="l2">Please don't make a fuss.</div></div>
  <img id="logo" src="assets/logo-wide.png">
  <svg id="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1350;
const tall = H / W > 1.5;
const s = tall ? 2.6 : 2.3;                       // cut-out scale
const st = document.getElementById('stage').style;
const set = (k, v) => document.documentElement.style.setProperty(k, v);
set('--W', W + 'px'); set('--H', H + 'px'); set('--s', s);
const dW = tall ? 520 : 480, dH = Math.round(H * (tall ? .44 : .5)), dY = Math.round(H * (tall ? .14 : .1));
set('--dW', dW + 'px'); set('--dH', dH + 'px'); set('--dY', dY + 'px'); set('--j', '26px');
set('--dX', Math.round(W / 2 - dW / 2) + 'px');
set('--hY', Math.round(dY + dH - 262 * s) + 'px');
set('--tY', Math.round(H * (tall ? .63 : .67)) + 'px');
set('--f1', (tall ? 84 : 78) + 'px'); set('--f2', (tall ? 40 : 36) + 'px');
set('--lW', (tall ? 380 : 340) + 'px'); set('--lB', (tall ? 150 : 70) + 'px');

const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;
// t in seconds; t < 0 means the finished still
window.frame = t => {
  const still = t < 0; if (still) t = 99;
  // slide out to show the nose, then shrink back a little at "don't make a fuss"
  let x = lerp(-101, -38, ease((t - 1.0) / 1.3));
  x = lerp(x, -52, ease((t - 3.9) / 0.6));
  if (still) x = -45;
  document.getElementById('hood').style.transform = `translateX(${x}%)`;
  document.getElementById('l1').style.opacity = ease((t - 2.7) / 0.6);
  document.getElementById('l2').style.opacity = ease((t - 3.7) / 0.6);
  document.getElementById('logo').style.opacity = ease((t - 4.9) / 0.8) * .9;
};
frame(-1);
</script>
</body></html>
