name = "mosspit-approvals"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Storage for the pending list. Replace the id with the one Cloudflare gives you
# (see SETUP.md, step 2).
[[kv_namespaces]]
binding = "PENDING"
id = "1c5342ad32504af1abd1da52c342f3ce"

# Private key store for the Introvert Here shop (Stripe secret key, Printify token), shared with "introvert-here-shop".
[[kv_namespaces]]
binding = "SECRETS"
id = "63ad737faf1143ea9fab08feab432837"
