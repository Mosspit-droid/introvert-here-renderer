# Private preview for the stealth game thread only (the shop preview belongs to another thread). Deploy with:
#   npx wrangler deploy -c wrangler.stealth.toml
name = "introvert-here-stealth-preview"
main = "worker.js"
compatibility_date = "2024-09-01"
workers_dev = true

# To fetch pictures for the build sandbox (see scheduled() in worker.js), switch this on for a few minutes:
# crons = ["* * * * *"]
[triggers]
crons = []

[vars]
PREVIEW = "yes"

[[kv_namespaces]]
binding = "PENDING"
id = "1c5342ad32504af1abd1da52c342f3ce"

# Anonymous test scores from the stealth game (Barry, 25 Nov): only this preview has it, so the real shop never stores any.
[[kv_namespaces]]
binding = "STEALTH_TALLY"
id = "42589198dc504881ac96b70cc62b82c3"

# The shop's product photos: every page of each garment's Canva mockup design (see "Photos" in approvals-app/worker.js).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "introvert-here-shop-photos"
